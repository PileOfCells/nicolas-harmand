name: Build and deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  # Ne pas annuler un déploiement en cours : un push rapproché laissait
  # auparavant le site figé sur une version intermédiaire.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          # Version du build natif GitHub Pages : garantit que le repli
          # « Deploy from a branch » reste possible si ce workflow casse.
          ruby-version: '3.3'
          bundler-cache: true

      - id: pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      - uses: actions/upload-pages-artifact@v3
        with:
          # Et non '.', qui publiait le dépôt entier — y compris les fichiers
          # sources .eps de 3,7 Mo et la documentation interne.
          path: ./_site

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
